<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background: linear-gradient(120deg, #667eea, #764ba2);
   min-height:100vh;
    overflow-x:hidden;

     display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

nav{
    width:100%;
   position:fixed;
    top:0;
    left:0;
    padding:20px 60px;
   display:flex;
    justify-content: space-between;
    align-items:center;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    z-index:1000;
    animation: slideDown 1s ease;
}

@keyframes slideDown{

     from{
        transform: translateY(-100%);
        opacity:0;
    }
    to{
        transform: translateY(0);
        opacity:1;
    }
}


.logo{
    font-size:1.8rem;
    font-weight:700;
    color:white;
}

nav ul{
   list-style:none;
    display:flex;
    gap:30px;
}

nav ul li a {
    color:white;
    text-decoration:none;
    font-size:1.1rem;
   position:relative;

}
/* Underline animation */
nav ul li a::after{
    content:"";
   position:absolute;
    left:0;
    bottom:-6px;
     width:0;
    height:3px;
    background:#ffdd57;
    transition:0.4s;
}

nav ul li a:hover::after{
    width:100%;
}

/* Floating circles */


.circle{
    position:absolute;
    border-radius:50%;
    background: rgba(255,255,255,0.15);
    animation: float 6s infinite ease-in-out;
}

.circle:nth-child(1){
    width:200px;
    height:200px;
    top:10%;
    left:10%;
}

.circle:nth-child(2){
    width:300px;
    height:300px;
    bottom:10%;
    right:15%;
    animation-delay:2s;
}

.circle:nth-child(3){
    width:150px;
    height:150px;
    bottom:30%;
    left:60%;
    animation-delay:4s;
}

@keyframes float{
   0%{
         transform: translateY(0);
         }
    50%{
         transform: translateY(-30px);
        }
    100%{
         transform: translateY(0);
         }
}

.container{
   position:relative;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    padding:60px;
    border-radius:20px;
   text-align:center;
    color:white;
    width:100%;
    max-width:500px;
    animation: fadeIn 1.5s ease;
}

/* Text Animation */
@keyframes fadeIn{
   from{
        opacity:0;
        transform: translateY(30px);
    }
    to{
        opacity:1;
        transform: translateY(0);
    }
}

.container h1{
    font-size:2.8rem;
    margin-bottom:15px;
}

.container p{
    font-size:1.1rem;
    margin-bottom:30px;
    opacity:0.9;
}


/* Button */
.btn{
    display:inline-block;
    padding:14px 40px;
    background: linear-gradient(45deg, #ff512f, #dd2476);
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-size:1.1rem;
    transition: all 0.4s ease;
    position:relative;
    overflow:hidden;
}

/* Button hover effect */
.btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width: 100%;
    height:100%;
    background: rgba(255,255,255,0.3);
    transition:0.5s;
}

.btn:hover::before{
    left:100%;
}

.btn:hover{
    transform: scale(1.08);
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
    </style>
</head>
<body>
    <!-- Floating Background Shapes -->
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
    <nav>
    <div class="logo">SONY</div>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>


<!-- Landing Content -->
<div class="container">
    <h1>Welcome ✨</h1>
    <p>Build beautiful, fast and animated websites using pure HTML & CSS.</p>
    <a href="#" class="btn">Get Started</a>
</div>
</body>
</html>
